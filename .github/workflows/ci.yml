name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@ba41b7532a626ba47e9bf7b74ba56c4a6808228a
  frontend:
    needs: workflows
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@ba41b7532a626ba47e9bf7b74ba56c4a6808228a
    with:
      component: frontend
  release:
    needs: [workflows, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true'
    permissions:
      contents: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/release.yml@ba41b7532a626ba47e9bf7b74ba56c4a6808228a
    with:
      releases: |
        [
          {"component":"frontend","image":"${{ needs.frontend.outputs.image }}","digest":"${{ needs.frontend.outputs.digest }}"}
        ]
    secrets:
      release-app-private-key: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
