name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@666b596743c0fd43a0ba3ed1efb8dc7b89b7593e
  sonar:
    needs: workflows
    uses: Narx-Space-Prod/platform-ci/.github/workflows/sonar.yml@c6f9cca79fa7533c4a2313746c4fb50d0e7fa839
    with:
      organization: ${{ vars.SONAR_ORGANIZATION }}
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
      server-url: ${{ vars.SONAR_SERVER_URL || 'https://sonarcloud.io' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  frontend:
    needs: [workflows, sonar]
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@666b596743c0fd43a0ba3ed1efb8dc7b89b7593e
    with:
      component: frontend
  release:
    needs: [workflows, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true'
    permissions:
      contents: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/release.yml@666b596743c0fd43a0ba3ed1efb8dc7b89b7593e
    with:
      releases: |
        [
          {"component":"frontend","image":"${{ needs.frontend.outputs.image }}","digest":"${{ needs.frontend.outputs.digest }}"}
        ]
    secrets:
      NARX_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
